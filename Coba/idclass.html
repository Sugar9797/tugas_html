<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ID</title>
    <style>
      /* ID menggunakan #, dan hanya ada boleh satu dalam satu HTML*/
      #judul {
        color: red;
      }
      /* Class menggunakan . , dan boleh digunakan dalam jumlah banyak */
      .judul {
        color: blueviolet;
        font-size: 20px;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="row">
      <div class="bg-primary col-6 col-md-4">Konten 1</div>
      <div class="bg-secondary col-6 col-md-4">Konten 2</div>
      <!-- <div class="bg-danger col-6 col-md-4">Konten 3</div> -->
    </div>
  </body>
</html>
