<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ID</title>
    <style>
      /* ID menggunakan #, dan hanya ada boleh satu dalam satu HTML*/
      #judul {
        color: red;
      }
      /* Class menggunakan . , dan boleh digunakan dalam jumlah banyak */
      .judul {
        color: blueviolet;
        font-size: 20px;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <!-- 1. CONTAINER (Kardus paling luar untuk menengahkan konten) -->
    <div class="container mt-5">
      <!-- 2. ROW (Baris untuk memastikan kolom di dalamnya sejajar) -->
      <div class="row">
        <!-- 3. COLUMN KIRI (Memakan jatah 8 dari 12 kolom untuk artikel utama) -->
        <div class="col-md-8">
          <!-- 4. KONTEN (Teks, gambar, dll bebas diletakkan di sini) -->
          <h1>Judul Artikel Utama</h1>
          <p>Ini adalah paragraf cerita yang panjang. Elemen teks atau gambar ini tidak boleh langsung diletakkan di dalam .row tanpa dibungkus .col terlebih dahulu.</p>
          <button class="btn btn-primary">Baca Selengkapnya</button>
        </div>

        <!-- 3. COLUMN KANAN (Memakan sisa jatah 4 kolom untuk sidebar) -->
        <div class="col-md-4">
          <!-- 4. KONTEN -->
          <div class="p-3 bg-light">
            <h4>Menu Samping</h4>
            <ul>
              <li>Profil</li>
              <li>Kategori</li>
            </ul>
          </div>
        </div>
      </div>
      <!-- Penutup Row -->
    </div>
    <!-- Penutup Container -->
  </body>
</html>
