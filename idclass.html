<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID</title>
    <style>
        /* ID menggunakan #, dan hanya ada boleh satu dalam satu HTML*/
        #judul{
            color:red;
        }
        /* Class menggunakan . , dan boleh digunakan dalam jumlah banyak */
        .judul{
            color: blueviolet;
            font-size:20px;
        }
    </style>
</head>
<body>
    
    <h1 id="judul">Ini contoh penggunaan ID</h1>
    <h1 class="judul">Ini contoh penggunaan Class</h1>
    <h2 class="judul">Ini adalah subtitle</h2>
</body>
</html>
